name: Automated ELT Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
    workflow_dispatch:      # Allows manual trigger from GitHub UI
  push:
    branches: [ main ]

jobs:
  run-elt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ELT Pipeline
        env:
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
        run: python pipeline.py

      - name: Commit and push updated database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.duckdb
          git diff --staged --quiet || git commit -m "chore: automated pipeline data update [skip ci]"
          git push