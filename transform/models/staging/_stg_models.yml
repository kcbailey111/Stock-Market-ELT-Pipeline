# Documentation and tests for the staging model.
# A test fails the build when its query finds bad rows.

version: 2

models:
  - name: stg_stock_prices
    description: Cleaned daily OHLCV prices, one row per symbol per trading day. Prices are unadjusted for splits and dividends.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [trade_date, symbol]
    columns:
      - name: trade_date
        description: US market trading day the prices apply to.
        data_tests:
          - not_null
      - name: symbol
        description: Upper-cased ticker symbol.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('symbols')
                field: symbol
      - name: close_price
        description: Unadjusted closing price in USD.
        data_tests:
          - not_null
      - name: volume
        description: Shares traded during the session.
      - name: loaded_at
        description: UTC timestamp of the pipeline run that first inserted the row.
